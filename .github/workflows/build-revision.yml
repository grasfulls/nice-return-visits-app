name: Generate app asset revision

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate the internal revision and update metadata
        run: |
          node scripts/build-revision.js --write
          node scripts/build-revision.js --check
          git add app.js service-worker.js version.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update generated app asset revision" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin HEAD:main
          fi
